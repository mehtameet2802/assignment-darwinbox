[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests", "ui", "app_pages", "flask_app.py", "streamlit_app.py", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ui", "app_pages"]
